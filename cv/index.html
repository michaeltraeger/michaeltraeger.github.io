<!doctype html> <html lang=en > <meta charset=UTF-8 > <meta name=viewport  content="width=device-width, initial-scale=1"> <link rel=stylesheet  href="/libs/highlight/styles/github.min.css"> <link rel=stylesheet  href="/css/franklin.css"> <link rel=stylesheet  href="/css/basic.css"> <link rel=icon  href="/assets/favicon.png"> <title>Full CV</title> <header> <div class=blog-name ><a href="/">Michael Traeger</a></div> <nav> <ul> <li><a href="/">Home</a> <li><a href="/research/">Research</a> <li><a href="/publications/">Publications</a> <li><a href="/grants/">Grants</a> <li><a href="/cv/">CV</a> </ul> <img src="/assets/hamburger.svg" id=menu-icon > </nav> </header> <div class=franklin-content > <h1 id=academic_cv ><a href="#academic_cv" class=header-anchor >Academic CV</a></h1> <p><a href="/assets/Traeger_CV_Git.pdf">Download my CV here</a></p> <p>Last updated 1 March 2026</p> <div class=page-foot > <a href="http://creativecommons.org/licenses/by-sa/4.0/">michael.traeger@burnet.edu.au</a>. </div> </div> <script src="/libs/highlight/highlight.min.js"></script> <script>hljs.highlightAll();hljs.configure({tabReplace: ' '});</script> <script> function renumberVisiblePubs() { const visiblePubs = Array.from(document.querySelectorAll('.pub')) .filter(pub => pub.style.display !== 'none'); visiblePubs.forEach((pub, index) => { const numEl = pub.querySelector('.pub-number'); if (numEl) { numEl.textContent = (index + 1) + '.'; } }); } function filterPubs(role) { const pubs = document.querySelectorAll('.pub'); let visibleCount = 0; pubs.forEach(pub => { if (role === 'all' || pub.classList.contains(role)) { pub.style.display = ''; visibleCount++; } else { pub.style.display = 'none'; } }); renumberVisiblePubs(); const countEl = document.getElementById('pub-count'); if (countEl) { let label = ''; if (role === 'all') label = 'papers'; if (role === 'first') label = 'first-author papers'; if (role === 'senior') label = 'senior-author papers'; if (role === 'coauthor') label = 'co-authored papers'; countEl.textContent = `${visibleCount} ${label}`; } } document.addEventListener('DOMContentLoaded', function() { if (document.querySelector('.pub')) { filterPubs('all'); } }); </script> <script> let currentAbstractType = 'all'; let currentConferenceType = 'all'; function setActiveButton(group, value) { const buttons = document.querySelectorAll(`button[data-group="${group}"]`); buttons.forEach(btn => { if (btn.dataset.value === value) { btn.classList.add('active-filter'); } else { btn.classList.remove('active-filter'); } }); } function renumberVisibleAbstracts() { const visibleAbstracts = Array.from(document.querySelectorAll('.abstract')) .filter(abs => abs.style.display !== 'none'); visibleAbstracts.forEach((abs, index) => { const numEl = abs.querySelector('.abstract-number'); if (numEl) { numEl.textContent = (index + 1) + '.'; } }); } function filterAbstracts(type, conference) { currentAbstractType = type; currentConferenceType = conference; const abstracts = document.querySelectorAll('.abstract'); let visibleCount = 0; abstracts.forEach(abs => { const matchType = type === 'all' || abs.classList.contains(type); const matchConf = conference === 'all' || abs.classList.contains(conference); if (matchType && matchConf) { abs.style.display = ''; visibleCount++; } else { abs.style.display = 'none'; } }); renumberVisibleAbstracts(); const countEl = document.getElementById('abstract-count'); if (countEl) { countEl.textContent = `${visibleCount} abstracts`; } setActiveButton('type', type); setActiveButton('conf', conference); } function filterAbstractType(type) { filterAbstracts(type, currentConferenceType); } function filterConferenceType(conference) { filterAbstracts(currentAbstractType, conference); } document.addEventListener('DOMContentLoaded', function() { if (document.querySelector('.abstract')) { filterAbstracts('all', 'all'); } }); </script>
